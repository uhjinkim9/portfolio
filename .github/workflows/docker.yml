name: CI - Build, Push, Update GitOps

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: portfolio
  GITOPS_REPOSITORY: uhjinkim9/helm-chart
  CHART_PATH: charts/portfolio

jobs:
  build-and-push:
    name: Build & Push Portfolio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ github.ref_name }}-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Update Helm image tag
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.45.4/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update portfolio image tag
        env:
          IMAGE_TAG: main-${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG:0:12}"
          VALUES_FILE="${CHART_PATH}/values.yaml"

          test -f "${VALUES_FILE}"
          yq -i '.image.tag = strenv(IMAGE_TAG)' "${VALUES_FILE}"
          test "$(yq '.image.tag' "${VALUES_FILE}")" = "${IMAGE_TAG}"

          echo "Portfolio image tag: ${IMAGE_TAG}"

      - name: Commit and push Helm values
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VALUES_FILE="${CHART_PATH}/values.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VALUES_FILE}"

          if git diff --cached --quiet; then
            echo "이미 최신 태그입니다."
            exit 0
          fi

          git commit -m "ci: deploy portfolio ${SOURCE_SHA:0:7} [skip ci]"
          git push origin main
